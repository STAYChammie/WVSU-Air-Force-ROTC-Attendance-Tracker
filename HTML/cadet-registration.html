<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/cadet-registration.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="../JS/cadet-registration.js"></script>
    <title>Cadet Registration - WVSU Air Force ROTC</title>
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <img src="../IMAGES/ROTC logo.png" alt="ROTC Logo">
                </div>
                <div class="brand-info">
                    <span class="brand-title">WVSU - Air Force ROTC Unit</span>
                </div>
                <button id="sidebarToggle" class="toggle-btn" aria-label="Toggle Sidebar">
                    <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6" />
                    </svg>
                </button>
            </div>

            <div class="sidebar-nav">
                <div class="nav-group">
                    <span class="nav-label">Analytics</span>
                    <a href="dashboard.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="9" />
                            <rect x="14" y="3" width="7" height="5" />
                            <rect x="14" y="12" width="7" height="9" />
                            <rect x="3" y="16" width="7" height="5" />
                        </svg>
                        <span class="nav-text">Dashboard</span>
                    </a>
                    <a href="campus-management.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 4z" />
                            <path d="M6.5 20h11a2.5 2.5 0 0 0-2.5-2.5h-6A2.5 2.5 0 0 0 6.5 20z" />
                        </svg>
                        <span class="nav-text">Campus Management</span>
                    </a>
                </div>

                <div class="nav-group">
                    <span class="nav-label">Administration</span>
                    <a href="cadet-registration.html" class="nav-item active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="20" y1="8" x2="20" y2="14"></line>
                            <line x1="17" y1="11" x2="23" y2="11"></line>
                        </svg>
                        <span class="nav-text">Cadet Registration</span>
                    </a>
                </div>

                <div class="nav-group">
                    <span class="nav-label">Cadet Scanner</span>
                    <a href="cadet-scanner.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span class="nav-text">QR Code Scanner</span>
                    </a>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="logoutBtn" class="nav-item logout-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    <span class="nav-text">Logout</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="page-header">
                <div class="header-title">
                    <h2>Cadet Personnel Enrolment Form</h2>
                    <p>Official registration portal for Air Force ROTC Unit cadets</p>
                </div>
                <div class="action-toolbar">
                    <label for="excelImportInput" class="btn btn-outline" style="cursor: pointer;">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Batch Import Excel
                    </label>
                    <input type="file" id="excelImportInput" accept=".xlsx, .xls" style="display: none;">
                </div>
            </div>

            <div class="form-card">
                <form id="cadetRegistrationForm">
                    
                    <!-- SECTION 1: PERSONAL INFORMATION -->
                    <fieldset class="form-section">
                        <legend class="section-title">
                            <span class="step-num">1</span>
                            Personal Information
                        </legend>

                        <div class="form-grid">
                            <div class="form-group">
                                <label for="lastName">Last Name <span class="required">*</span></label>
                                <input type="text" id="lastName" name="lastName" class="form-input" placeholder="e.g. DELA CRUZ" required>
                            </div>

                            <div class="form-group">
                                <label for="firstName">First Name <span class="required">*</span></label>
                                <input type="text" id="firstName" name="firstName" class="form-input" placeholder="e.g. JUAN" required>
                            </div>

                            <div class="form-group">
                                <label for="middleName">Middle Name</label>
                                <input type="text" id="middleName" name="middleName" class="form-input" placeholder="e.g. SANTOS">
                            </div>

                            <div class="form-group">
                                <label for="extensionName">Suffix</label>
                                <input type="text" id="extensionName" name="extensionName" class="form-input" placeholder="e.g. JR., III">
                            </div>

                            <div class="form-group">
                                <label for="gender">Gender <span class="required">*</span></label>
                                <select id="gender" name="gender" class="form-select" required>
                                    <option value="" disabled selected>Select gender...</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="birthDate">Date of Birth <span class="required">*</span></label>
                                <input type="date" id="birthDate" name="birthDate" class="form-input" required>
                            </div>

                            <div class="form-group">
                                <label for="contactNumber">Contact Number <span class="required">*</span></label>
                                <input type="tel" id="contactNumber" name="contactNumber" class="form-input" placeholder="09123456789" required>
                            </div>

                            <div class="form-group">
                                <label for="emailAddress">Email Address <span class="required">*</span></label>
                                <input type="email" id="emailAddress" name="emailAddress" class="form-input" placeholder="cadet@wvsu.edu.ph" required>
                            </div>
                        </div>
                    </fieldset>

                    <!-- SECTION 2: ACADEMIC & ROTC DETAILS -->
                    <fieldset class="form-section">
                        <legend class="section-title">
                            <span class="step-num">2</span>
                            Academic & ROTC Profile
                        </legend>

                        <div class="form-grid">
                            <div class="form-group">
                                <label for="studentNumber">Student ID Number <span class="required">*</span></label>
                                <input type="text" id="studentNumber" name="studentNumber" class="form-input" placeholder="e.g. 2023M0123" required>
                            </div>

                            <div class="form-group">
                                <label for="campus">Institution / Campus <span class="required">*</span></label>
                                <select id="campus" name="campus" class="form-select" required>
                                    <option value="" disabled selected>Select campus...</option>
                                    <option value="WVSU - Main Campus">WVSU - Main Campus</option>
                                    <option value="St. Therese MTC - Colleges">St. Therese MTC - Colleges</option>
                                    <option value="Iloilo Doctors' College">Iloilo Doctors' College</option>
                                    <option value="Asian College of Aeronautics">Asian College of Aeronautics</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="course">Degree Program / Course <span class="required">*</span></label>
                                <input type="text" id="course" name="course" class="form-input" placeholder="e.g. BS Information Systems" required>
                            </div>

                            <div class="form-group">
                                <label for="yearLevel">Year Level <span class="required">*</span></label>
                                <select id="yearLevel" name="yearLevel" class="form-select" required>
                                    <option value="" disabled selected>Select year...</option>
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                    <option value="3rd Year">3rd Year</option>
                                    <option value="4th Year">4th Year</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="rotcComponent">ROTC Course / Class <span class="required">*</span></label>
                                <select id="rotcComponent" name="rotcComponent" class="form-select" required>
                                    <option value="MS 1">MS 1 (Basic ROTC - 1st Sem)</option>
                                    <option value="MS 2">MS 2 (Basic ROTC - 2nd Sem)</option>
                                    <option value="MS 31/32">Advance ROTC (Cadet Officer)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="platoon">Company / Unit Designation</label>
                                <input type="text" id="platoon" name="platoon" class="form-input" placeholder="e.g. Alpha Company, 1st Platoon">
                            </div>
                        </div>
                    </fieldset>

                    <!-- SECTION 3: EMERGENCY CONTACT DETAILS -->
                    <fieldset class="form-section">
                        <legend class="section-title">
                            <span class="step-num">3</span>
                            Emergency Contact Person
                        </legend>

                        <div class="form-grid">
                            <div class="form-group">
                                <label for="guardianName">Guardian / Parent Full Name <span class="required">*</span></label>
                                <input type="text" id="guardianName" name="guardianName" class="form-input" placeholder="e.g. MARIA DELA CRUZ" required>
                            </div>

                            <div class="form-group">
                                <label for="guardianRelationship">Relationship <span class="required">*</span></label>
                                <input type="text" id="guardianRelationship" name="guardianRelationship" class="form-input" placeholder="e.g. Mother, Father, Legal Guardian" required>
                            </div>

                            <div class="form-group full-width">
                                <label for="guardianContact">Guardian Primary Contact Number <span class="required">*</span></label>
                                <input type="tel" id="guardianContact" name="guardianContact" class="form-input" placeholder="09123456789" required>
                            </div>
                        </div>
                    </fieldset>

                    <!-- FORM FOOTER ACTIONS -->
                    <div class="form-actions">
                        <button type="reset" class="btn btn-outline">Reset Form</button>
                        <button type="submit" id="submitBtn" class="btn btn-primary">
                            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="8.5" cy="7" r="4"></circle>
                                <line x1="20" y1="8" x2="20" y2="14"></line>
                                <line x1="17" y1="11" x2="23" y2="11"></line>
                            </svg>
                            Complete Registration
                        </button>
                    </div>

                </form>
            </div>
        </main>
    </div>
</body>
</html>
